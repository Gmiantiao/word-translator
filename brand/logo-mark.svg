<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="面条捞词">
  <title>面条捞词 NoodlePicker</title>
  <defs>
    <linearGradient id="huaciTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="huaciSwipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="116" fill="url(#huaciTile)"/>

  <!-- mark: a word underlined by a highlighter swipe.
       The four strokes of the W are bowed the same way round, so the letter
       also reads as one bent noodle. Kept subtle on purpose: at 16px the
       curves collapse and an alternating bow turns the W into a blob. -->
  <g transform="translate(0,9.5) translate(256,256) scale(1.06) translate(-256,-256)">
    <g transform="rotate(-3 256 308)">
      <rect x="88" y="268" width="336" height="80" rx="40" fill="url(#huaciSwipe)"/>
    </g>
    <path d="M128 162 Q 131 264 194 344 Q 196 263 256 208 Q 258 289 318 344 Q 381 264 384 162"
          fill="none" stroke="#ffffff" stroke-width="48"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
