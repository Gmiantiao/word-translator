<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="面条捞词">
  <title>面条捞词 NoodlePicker — 小尺寸变体</title>
  <defs>
    <linearGradient id="huaciTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="116" fill="url(#huaciTile)"/>

  <!-- At 16px the swipe smears into a yellow blob and eats the M's legibility,
       so the small variant drops it and scales the M up instead.
       The bow is the same shape as the main mark, scaled with the stroke width. -->
  <path d="M112 362 Q 115 243 190 150 Q 187 245 256 310 Q 253 215 322 150 Q 397 243 400 362"
        fill="none" stroke="#ffffff" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
