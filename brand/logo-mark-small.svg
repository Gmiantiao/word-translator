<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="拾词">
  <title>拾词 WordPicker — 小尺寸变体</title>
  <defs>
    <linearGradient id="huaciTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="116" fill="url(#huaciTile)"/>

  <!-- At 16px the swipe smears into a yellow blob and eats the W's legibility,
       so the small variant drops it and scales the W up instead. -->
  <path d="M112 150 L190 362 L256 202 L322 362 L400 150"
        fill="none" stroke="#ffffff" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
